[extensions.rust]
package = "morphir-rust-binding"
artifact = "morphir-rust-binding"
extension_id = "morphir-rust"
name = "Morphir Rust"
mep_versions = ["0.1"]
targets = ["rust"]
languages = [{ id = "rust", file_extensions = [".rs"] }]
ir_versions = ["3", "4"]
release_with_workspace = true

[extensions.avro]
package = "morphir-avro-extension"
artifact = "morphir-avro-extension"
extension_id = "morphir-avro"
name = "Morphir Avro"
mep_versions = ["0.1"]
targets = ["avro"]
ir_versions = ["3", "4"]
release_with_workspace = true

[extensions.elm-native]
package = "morphir-elm-binding"
artifact = "morphir-elm-binding"
extension_id = "morphir-elm-native"
name = "Morphir Elm (native)"
mep_versions = ["0.1"]
targets = ["elm"]
languages = [{ id = "elm", file_extensions = [".elm"] }]
incremental = true
workspace_discovery = true
ir_versions = ["3", "4"]
release_with_workspace = true

[extensions.python]
package = "morphir-python-binding"
artifact = "morphir-python-binding"
extension_id = "morphir-python"
name = "Morphir Python"
mep_versions = ["0.1"]
targets = ["python"]
languages = [{ id = "python", file_extensions = [".py"] }]
ir_versions = ["3", "4"]
release_with_workspace = true

[extensions.gleam]
package = "morphir-gleam-binding"
artifact = "morphir-gleam-binding"
extension_id = "morphir-gleam"
name = "Morphir Gleam"
mep_versions = ["0.1"]
targets = ["gleam"]
languages = [{ id = "gleam", file_extensions = [".gleam"] }]
incremental = true
workspace_discovery = true
ir_versions = ["3", "4"]
release_with_workspace = true

[extensions.openapi]
package = "morphir-openapi-extension"
artifact = "morphir-openapi-extension"
extension_id = "morphir-openapi"
name = "Morphir OpenAPI"
mep_versions = ["0.1"]
targets = ["openapi", "json-schema"]
ir_versions = ["3", "4"]
release_with_workspace = true
