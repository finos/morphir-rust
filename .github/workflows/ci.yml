name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Weekly full run as a safety net for anything the impact graph misses.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: Run every job regardless of what changed
        type: boolean
        default: false

# Superseded PR runs are cancelled. Runs on main always finish, because they
# are the only runs that save dependency caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  changes:
    name: Classify CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.classify.outputs.all }}
      crates: ${{ steps.classify.outputs.crates }}
      cargo_packages: ${{ steps.classify.outputs.cargo_packages }}
      extensions: ${{ steps.classify.outputs.extensions }}
      job_rust: ${{ steps.classify.outputs.job_rust }}
      job_kit_conformance: ${{ steps.classify.outputs.job_kit_conformance }}
      job_workspace_wasm: ${{ steps.classify.outputs.job_workspace_wasm }}
      job_test_native_extension: ${{ steps.classify.outputs.job_test_native_extension }}
      job_test_daemon_extension: ${{ steps.classify.outputs.job_test_daemon_extension }}
      job_test_extism: ${{ steps.classify.outputs.job_test_extism }}
      job_example_wasm: ${{ steps.classify.outputs.job_example_wasm }}
      job_lint_shell: ${{ steps.classify.outputs.job_lint_shell }}
      job_lint_yaml: ${{ steps.classify.outputs.job_lint_yaml }}
      job_docs_generated: ${{ steps.classify.outputs.job_docs_generated }}
      job_test_release_workflow: ${{ steps.classify.outputs.job_test_release_workflow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this is a full run
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FULL: ${{ github.event.inputs.full }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          full=false
          if [ "$EVENT_NAME" = "schedule" ]; then
            full=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_FULL" = "true" ]; then
            full=true
          elif [ -n "$PR_NUMBER" ]; then
            # Read the labels live so that adding ci:full and re-running works.
            labels="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' || true)"
            case "$labels" in
              *ci:full*) full=true ;;
            esac
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL_RUN: ${{ steps.mode.outputs.full }}
        run: |
          if [ "$FULL_RUN" = "true" ]; then
            python3 .github/scripts/classify_ci_changes.py --full
            python3 .github/scripts/classify_ci_changes.py --full --format text >&2 || true
          else
            python3 .github/scripts/classify_ci_changes.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA"
            python3 .github/scripts/classify_ci_changes.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --format text >&2 || true
          fi

  test-release-workflow:
    name: Test (release workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_test_release_workflow == 'true') }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test Python release tooling
        run: python3 -m unittest discover -s tests/ci -v

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Check repository TypeScript tooling
        run: mise run tools:typecheck

  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_rust == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check formatting
        run: mise run check:fmt

      - name: Lint with Clippy
        run: mise run check:lint:rust -- ${{ needs.changes.outputs.cargo_packages }}

  provider-windows-standard-user:
    name: Ordinary-user provider candidate (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_kit_conformance == 'true') }}
    env:
      MISE_ENABLE_TOOLS: rust
      CARGO_TERM_COLOR: never
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: aarch64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Enable long Git dependency paths on Windows
        run: git config --global core.longpaths true
      - name: Install Rust through mise
        uses: jdx/mise-action@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build and execute under a separate standard-user account
        shell: pwsh
        env:
          PROBE_TARGET: ${{ matrix.target }}
          PROBE_ARCH: ${{ matrix.arch }}
        run: ./.github/scripts/test_windows_standard_user_provider.ps1
      - name: Upload ordinary-user candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-user-provider-${{ matrix.arch }}
          include-hidden-files: true
          if-no-files-found: error
          path: .dev/out/ordinary-user/

  kit-conformance:
    name: Kit conformance (${{ matrix.os }})
    env:
      # Avoid unrelated documentation and coverage toolchains on Windows.
      MISE_ENABLE_TOOLS: rust,bun
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_kit_conformance == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable long Git dependency paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Test package library and adapter protocols
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          mkdir -p .dev/out/provider-candidate
          printf '%s\n' \
            'Candidate-provider probe evidence only; no production qualification or power-loss durability claim.' \
            > .dev/out/provider-candidate/scope.txt
          rustc -vV > .dev/out/provider-candidate/rustc.txt
          cargo test --locked -p morphir-package -p morphir-mck-adapter \
            -- --nocapture --test-threads=1 2>&1 | tee .dev/out/provider-candidate/native-package-tests.log

      - name: Upload candidate-provider probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-provider-probes-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: .dev/out/provider-candidate/

      - name: Test native CLI acquisition and MCK orchestration
        run: mise run tools:test

      - name: Test package-local TUF version boundaries
        run: |
          rustup component add rustfmt
          cargo fmt --manifest-path third_party/morphir-package-tough/Cargo.toml -- --check
          cargo test --locked --manifest-path third_party/morphir-package-tough/Cargo.toml --lib --test exact_versions --test fixed_time --test unicode_canonicalization

      - name: Test experimental TUF transactional storage
        run: cargo test --locked --manifest-path third_party/morphir-package-tough/Cargo.toml --features experimental-storage --test experimental_storage

      - name: Test package-local TUF upstream regressions
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path third_party/morphir-package-tough/Cargo.toml --tests

      - name: Lint package library and adapter
        run: |
          rustup component add clippy
          cargo clippy --locked -p morphir-package -p morphir-mck-adapter --all-targets -- -D warnings

      - name: Run the native Morphir Compatibility Kit against the adapter
        run: mise run check:kit

      - name: Upload kit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mck-report-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .dev/out/mck/report.json
            .dev/out/mck/report.html

  lint-shell:
    name: Lint (Shell)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_lint_shell == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Lint shell scripts
        run: mise run check:lint:shell

  lint-yaml:
    name: Lint (YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_lint_yaml == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Lint YAML files
        run: mise run check:lint:yaml

  docs-generated:
    name: Check generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_docs_generated == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Generate CLI docs
        run: mise run --skip-tools docs:generate

      - name: Check docs are up to date
        run: |
          if ! docs_status="$(git status --porcelain --untracked-files=all -- docs/)"; then
            echo "::error::Unable to inspect generated documentation."
            exit 1
          fi

          if [ -n "$docs_status" ]; then
            echo "::error::Generated documentation is out of date. Run 'mise run docs:generate' and commit the changes."
            git status --short --untracked-files=all -- docs/
            git diff -- docs/
            exit 1
          fi

  example-wasm:
    name: Build (example WASM extension)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_example_wasm == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install Rust components
        run: rustup component add clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Lint example extension for wasm32
        run: mise run check:lint:wasm

      - name: Build example extension for wasm32
        run: mise run build:wasm release

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: morphir-ext-example-wasm
          path: .morphir/build/ext/morphir_ext_example.wasm
          retention-days: 1

  test-extism:
    name: Test (Extism extensions)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_test_extism == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Test real Extism extension through MEP
        run: mise run test:extism

      - name: Upload MEP conformance extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: morphir-wasm-binding-wasm
          path: target/wasm32-unknown-unknown/release/morphir_wasm_binding.wasm
          retention-days: 1

  extension-bundle:
    name: Extension bundle (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.extensions != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.extensions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build and test the extension release bundle
        run: mise run "extension:artifact:${{ matrix.id }}"

      # The host that ships these bundles is the morphir CLI from finos/morphir. The pinned
      # release is downloaded and verified by the task, so no checkout of that repository is used.
      # The CLI compiles morphir-elm-native in as an opt-in provider, so finos/morphir owns that
      # check; an installed bundle with the same id is not how users reach it.
      - name: Publish, install and use the bundle through the released morphir CLI
        if: matrix.id != 'elm-native'
        run: mise run test:cli-release "${{ matrix.id }}"

      - name: Upload extension release bundle
        uses: actions/upload-artifact@v7
        with:
          name: morphir-${{ matrix.id }}-extension-bundle
          path: .morphir/build/extensions/${{ matrix.id }}/*
          if-no-files-found: error
          retention-days: 7

      - name: Test generated Python functions and closures
        if: matrix.id == 'python'
        env:
          MORPHIR_TEST_PYTHON: python3
        run: cargo test --locked -p morphir-python-binding --test functions -- --ignored

  workspace-wasm:
    name: Build (workspace discovery WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_workspace_wasm == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Test workspace discovery consumers
        run: mise exec -- cargo test -p morphir-config -p morphir-workspace -p morphir-workspace-wasm -p morphir-devkit -p morphir-daemon

      - name: Check portable workspace crates for WASM
        run: mise exec -- cargo check -p morphir-config -p morphir-workspace -p morphir-workspace-wasm --target wasm32-unknown-unknown

      - name: Export browser workspace package
        run: mise run build:workspace-wasm

  test-native-extension:
    name: Test (native process extension)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_test_native_extension == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Test real native extension through MEP
        run: mise run test:process

  test-daemon-extension:
    name: Test (connected daemon extension)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_test_daemon_extension == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Test real connected daemon extension through MEP
        run: mise run test:daemon

  test-unit:
    name: Test (Unit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_rust == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Run unit tests
        run: mise run test:unit -- ${{ needs.changes.outputs.cargo_packages }}

      - name: Run integration tests
        run: mise run test:integration -- ${{ needs.changes.outputs.cargo_packages }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_rust == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build Rust docs
        run: cargo doc --no-deps ${{ needs.changes.outputs.cargo_packages }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.job_rust == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Run coverage check
        env:
          CI_PACKAGES: ${{ needs.changes.outputs.crates }}
        run: mise run check:coverage --force

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          if-no-files-found: ignore
          retention-days: 14

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ always() }}
    needs:
      - changes
      - test-release-workflow
      - lint-rust
      - kit-conformance
      - provider-windows-standard-user
      - lint-shell
      - lint-yaml
      - docs-generated
      - example-wasm
      - test-extism
      - extension-bundle
      - workspace-wasm
      - test-native-extension
      - test-daemon-extension
      - test-unit
      - docs
      - coverage
    steps:
      - name: Fail if classification or any needed job failed
        if: ${{ needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required job failed or was cancelled."
          exit 1
      - name: All required jobs passed or were skipped
        run: echo "CI OK"
