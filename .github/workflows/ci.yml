name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs when a new run is triggered on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: mise run check:fmt

      - name: Lint with Clippy
        run: mise run check:lint:rust

  lint-shell:
    name: Lint (Shell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Lint shell scripts
        run: mise run check:lint:shell

  lint-yaml:
    name: Lint (YAML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Lint YAML files
        run: mise run check:lint:yaml

  build-wasm:
    name: Build (WASM extension)
    runs-on: ubuntu-latest
    needs: [lint-rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install Rust components
        run: rustup component add clippy

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Lint example extension for wasm32
        run: mise run check:lint:wasm

      - name: Build example extension for wasm32
        run: mise run build:wasm release

      - name: Test real Extism extension through MEP
        run: mise run test:extism

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: morphir-ext-example-wasm
          path: .morphir/build/ext/morphir_ext_example.wasm
          retention-days: 1

      - name: Upload MEP conformance extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: morphir-wasm-binding-wasm
          path: target/wasm32-unknown-unknown/release/morphir_wasm_binding.wasm
          retention-days: 1

  workspace-wasm:
    name: Build (workspace discovery WASM)
    runs-on: ubuntu-latest
    needs: [lint-rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            target
          key: ${{ runner.os }}-cargo-workspace-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-workspace-wasm-

      - name: Test workspace discovery consumers
        run: mise exec -- cargo test -p morphir-config -p morphir-workspace -p morphir-workspace-wasm -p morphir-devkit -p morphir-daemon

      - name: Check portable workspace crates for WASM
        run: mise exec -- cargo check -p morphir-config -p morphir-workspace -p morphir-workspace-wasm --target wasm32-unknown-unknown

      - name: Export browser workspace package
        run: mise run build:workspace-wasm

  test-native-extension:
    name: Test (native process extension)
    runs-on: ubuntu-latest
    needs: [lint-rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-native-extension-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-extension-

      - name: Test real native extension through MEP
        run: mise run test:process

  test-daemon-extension:
    name: Test (connected daemon extension)
    runs-on: ubuntu-latest
    needs: [lint-rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-daemon-extension-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-daemon-extension-

      - name: Test real connected daemon extension through MEP
        run: mise run test:daemon

  test-unit:
    name: Test (Unit)
    runs-on: ubuntu-latest
    needs: [lint-rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run unit tests
        run: mise run test:unit

      - name: Run integration tests
        run: mise run test:integration

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: [lint-rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Build Rust docs
        run: cargo doc --no-deps

      - name: Generate CLI docs
        run: mise run docs:generate

      - name: Check docs are up to date
        run: |
          if ! git diff --quiet docs/; then
            echo "::error::Generated documentation is out of date. Run 'mise run docs:generate' and commit the changes."
            git diff docs/
            exit 1
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [lint-rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Run coverage check
        run: mise run check:coverage --force

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 14
