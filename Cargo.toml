[workspace]
members = [
    "crates/*",
]
resolver = "2"

# Don't build examples by default (morphir-ext-example needs wasm32 target)
default-members = [
    "crates/morphir-builtins",
    "crates/morphir-common",
    "crates/morphir-config",
    "crates/morphir-core",
    "crates/morphir-daemon",
    "crates/morphir-devkit",
    "crates/morphir-distribution",
    "crates/morphir-ext",
    "crates/morphir-ext-core",
    "crates/morphir-extension-sdk",
    "crates/morphir-gleam-binding",
    "crates/morphir-kb",
    "crates/morphir-okf",
    "crates/morphir-runtime",
    "crates/morphir-wasm-binding",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
authors = ["FINOS <info@finos.org>"]
license = "Apache-2.0"
repository = "https://github.com/finos/morphir-rust"
homepage = "https://github.com/finos/morphir-rust"
documentation = "https://docs.rs/morphir-rust"
keywords = ["morphir", "functional", "domain-modeling", "ir"]
categories = ["development-tools", "parsers"]

[workspace.dependencies]
# CLI framework
starbase = "0.13"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
miette = { version = "7", features = ["fancy"] }
vfs = "0.13"
serde-saphyr = { version = "1", default-features = false, features = ["deserialize", "serialize"] }
stacker = "0.1"

# TUI
ratatui = "0.30"
crossterm = "0.29"
tuirealm = "3"
tui-realm-stdlib = "3"
tui-realm-textarea = "2"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
url = "2.5.8"
percent-encoding = "2.3.2"
tempfile = "3"
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"

# Functional programming utilities
# Add more as needed

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
