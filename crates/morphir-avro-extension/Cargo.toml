[package]
name = "morphir-avro-extension"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Avro backend extension for Morphir"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
morphir-core = { path = "../morphir-core", version = "0.2.0" }
morphir-extension-sdk = { path = "../morphir-extension-sdk", version = "0.2.0" }
morphir-projection = { path = "../morphir-projection", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = { workspace = true }

[dev-dependencies]
apache-avro = "=0.22.0"
morphir-projection = { path = "../morphir-projection", version = "0.1.0", features = ["testing"] }
pretty_assertions = "1.4"
