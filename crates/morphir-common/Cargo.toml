[package]
name = "morphir-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true }
cap-std = { workspace = true }
cap-fs-ext = { workspace = true }
same-file = { workspace = true }
thiserror = { workspace = true }
morphir-config = { path = "../morphir-config" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { workspace = true }
stacker = { workspace = true }
secrecy = "0.10.3"
toml = "1.0"
dirs = "6"
morphir-core = { path = "../morphir-core" }
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
nbformat = "~1.2"
uuid = { version = "1.0", features = ["v4"] }
vfs = { workspace = true }
unicode-casefold = { workspace = true }
unicode-normalization = { workspace = true }
fs2 = { workspace = true }
tracing = { workspace = true }

# Remote source support
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
    "json",
] }
flate2 = "1.0"
zip = "8.0"
tar = "0.4"
tempfile = "3"

[dev-dependencies]
cucumber = "0.23"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "streaming_migration_acceptance"
harness = false

[[test]]
name = "cache_maintenance_inventory_acceptance"
harness = false

[[test]]
name = "cache_maintenance_execution_acceptance"
harness = false

[[test]]
name = "cache_maintenance_state"
