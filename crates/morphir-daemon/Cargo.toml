[package]
name = "morphir-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Morphir daemon services on top of the extension host: errors, extension file loading, virtual paths and workspaces"

[dependencies]
# Workspace dependencies
anyhow = { workspace = true }
thiserror = { workspace = true }

# Async file access for the extension cache
tokio = { version = "1", features = ["fs"] }

# Serialization
serde_json = "1.0"

# File watching errors (DaemonError::Watch)
notify = "8"

# Configuration errors (DaemonError::Toml)
toml = "1.0"

# Logging
tracing = "0.1"

# HTTP client (for downloading extensions)
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Internal crates
morphir-common = { path = "../morphir-common" }
morphir-devkit = { path = "../morphir-devkit" }
morphir-host = { path = "../morphir-host" }
morphir-workspace = { path = "../morphir-workspace", version = "0.2.0" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
