[package]
name = "morphir-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Morphir daemon service for workspace management, builds, and IDE integration"

[dependencies]
# Workspace dependencies
anyhow = { workspace = true }
thiserror = { workspace = true }

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "io-util",
    "net",
    "process",
    "signal",
    "time",
] }
async-trait = "0.1"

# JSON-RPC
jsonrpsee = { version = "0.26", features = ["server", "client", "macros"] }

# Serialization
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File watching
notify = "8"

# Configuration
toml = "1.0"

# Logging
tracing = "0.1"
unicode-casefold = { workspace = true }
unicode-normalization = { workspace = true }

# WASM plugin runtime (Extism)
extism = "1"

# HTTP client (for downloading extensions)
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }

# Directory utilities
dirs = "6"
tempfile = "3"

# Internal crates
morphir-core = { path = "../morphir-core" }
morphir-common = { path = "../morphir-common" }
morphir-devkit = { path = "../morphir-devkit" }
morphir-distribution = { path = "../morphir-distribution" }
morphir-extension-sdk = { path = "../morphir-extension-sdk" }
morphir-workspace = { path = "../morphir-workspace" }

[dev-dependencies]
wat = "1"
