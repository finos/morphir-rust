[package]
name = "morphir-elm-binding"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Elm type frontend and backend for Morphir IR v3 and v4, built on tree-sitter"
links = "tree_sitter_elm"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
morphir-core = { path = "../morphir-core" }
morphir-extension-sdk = { path = "../morphir-extension-sdk" }
tree-sitter = "0.27"
tree-sitter-language = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
toml = "1"
sha2 = "0.10"
pretty = "0.12"
thiserror.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
cucumber = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
regex-lite = "0.1"

[features]
wasm-host-tests = ["dep:extism"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
extism = { version = "1", optional = true }

[package.metadata.coverage]
threshold = 40
