  # Note: Morphir.IR.SDK.Number.elm's moduleSpec declares its one type under the
  # name "Decimal" (apparently copy-pasted from Decimal.elm), not "Number", even
  # though the module's own `numberType` helper references a type named "Number".
  # This mirrors the source as written; see task-3-report.md.
  [[package.module]]
  name = "Number"
  types = [
    { name = "Decimal" },
  ]

  [[package.module]]
  name = "Int"
  types = [
    { name = "Int8" },
    { name = "Int16" },
