id = "elm-core"

# Implicit imports, as morphir-elm's IncrementalResolve.defaultImports
# (ecosystem/morphir-elm/src/Morphir/Elm/IncrementalResolve.elm:114-186).

[[implicit_import]]
module = "Basics"
exposing = ["Int", "Float", "Order(..)", "Bool", "Never"]
# values (for the values task): toFloat round floor ceiling truncate max min compare not xor modBy remainderBy negate abs clamp sqrt logBase e pi cos sin tan acos asin atan atan2 degrees radians turns toPolar fromPolar isNaN isInfinite identity always never

[[implicit_import]]
module = "List"
exposing = ["List"]

[[implicit_import]]
module = "Maybe"
exposing = ["Maybe(..)"]

[[implicit_import]]
module = "Result"
exposing = ["Result(..)"]

[[implicit_import]]
module = "String"
exposing = ["String"]

[[implicit_import]]
module = "Char"
exposing = ["Char"]

[[implicit_import]]
module = "Tuple"
exposing = []

# Module aliases, one per morphir-elm's IncrementalResolve.sdkModuleMapping
# (ecosystem/morphir-elm/src/Morphir/Elm/IncrementalResolve.elm:191-209).

[[module_alias]]
source = "Basics"
target = "Morphir.SDK.Basics"

[[module_alias]]
source = "List"
target = "Morphir.SDK.List"

[[module_alias]]
source = "Dict"
target = "Morphir.SDK.Dict"

[[module_alias]]
source = "Set"
target = "Morphir.SDK.Set"

[[module_alias]]
source = "Maybe"
target = "Morphir.SDK.Maybe"

[[module_alias]]
source = "Result"
target = "Morphir.SDK.Result"

[[module_alias]]
source = "String"
target = "Morphir.SDK.String"

[[module_alias]]
source = "Char"
target = "Morphir.SDK.Char"

[[module_alias]]
source = "Tuple"
target = "Morphir.SDK.Tuple"

[[module_alias]]
source = "Regex"
target = "Morphir.SDK.Regex"

# Platform package: types declared by each ecosystem/morphir-elm/src/Morphir/IR/SDK/*.elm module.

[[package]]
name = "Morphir.SDK"

  [[package.module]]
  name = "Basics"
  types = [
    { name = "Int" },
    { name = "Float" },
    { name = "Order", constructors = ["LT", "EQ", "GT"] },
    { name = "Bool" },
    { name = "Never" },
  ]

  [[package.module]]
  name = "List"
  types = [
