[package]
name = "morphir-extension-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SDK for building Morphir extensions as WASM plugins"

[lib]
crate-type = ["rlib"]

[dependencies]
# Workspace dependencies
thiserror = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Plugin development kit for WASM guests. Native hosts must not link guest imports.
extism-pdk = "1.2"

[features]
default = []
# Retained for compatibility. Transport-neutral types are available by default.
host = []
