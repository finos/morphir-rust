[package]
name = "morphir-extension-sdk"
# Published on its own 0.x.y line, not the shared workspace version.
# See docs/contributors/publishing-crates.md.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/morphir-extension-sdk"
readme = "README.md"
description = "SDK for building Morphir extensions as WASM plugins"
keywords = ["morphir", "extension", "plugin", "wasm", "sdk"]
categories = ["development-tools", "wasm"]

[lib]
crate-type = ["rlib"]

[dependencies]
# Workspace dependencies
morphir-json = { path = "../morphir-json", version = "0.2.0" }
morphir-workspace = { path = "../morphir-workspace", version = "0.2.0" }
thiserror = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
semver = { version = "1", features = ["serde"] }
base64 = "0.23.0"
sha2 = "0.11"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# ion-rs 1.0.1 unconditionally enables Chrono's browser bindings. Keep this
# reader native-only until a non-browser Ion reader is qualified for MEP WASM.
ion-rs = { version = "=1.2.0", features = ["experimental-reader-writer", "experimental-tooling-apis"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Plugin development kit for WASM guests. Native hosts must not link guest imports.
extism-pdk = "1.2"

[features]
default = []
# Retained for compatibility. Transport-neutral types are available by default.
host = []
