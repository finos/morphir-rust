[package]
name = "morphir-gleam-binding"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Gleam language binding for Morphir - frontend and backend extension"

[package.metadata.coverage]
threshold = 40 # Minimum line coverage percentage required

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Extension SDK
morphir-extension-sdk = { path = "../morphir-extension-sdk" }

# WASM plugin development
extism-pdk = "1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parser dependencies
logos = "0.16"
chumsky = "0.13"

# Morphir IR (for visitors)
morphir-core = { path = "../morphir-core" }
indexmap = "2.0"                                # Required for V4 IndexMap structures
num-bigint = "0.4"                              # IntegerLiteral is arbitrary precision
anyhow = "1.0"
url = { workspace = true }
percent-encoding = { workspace = true }
sha2 = "0.10"

# Pretty printing (Wadler-style)
pretty = "0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
morphir-common = { path = "../morphir-common" }
cap-std = { workspace = true }
cap-fs-ext = { workspace = true }
extism = { version = "1", optional = true }

[features]
wasm-host-tests = ["dep:extism"]

[dev-dependencies]
cucumber = { version = "0.23", features = ["output-json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[[test]]
name = "acceptance"
harness = false
