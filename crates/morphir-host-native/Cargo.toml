[package]
name = "morphir-host-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native channels for the Morphir extension host: processes, Extism and in-process guests"

[dependencies]
morphir-host = { path = "../morphir-host" }
morphir-extension-sdk = { path = "../morphir-extension-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "io-util", "process", "time", "macros"] }

[dev-dependencies]
morphir-host = { path = "../morphir-host", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
