[package]
name = "morphir-host-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native channels for the Morphir extension host: processes, Extism and in-process guests"

[dependencies]
morphir-common = { path = "../morphir-common" }
morphir-core = { path = "../morphir-core", version = "0.2.0" }
morphir-distribution = { path = "../morphir-distribution" }
morphir-extension-sdk = { path = "../morphir-extension-sdk", version = "0.2.0" }
morphir-host = { path = "../morphir-host" }
morphir-workspace = { path = "../morphir-workspace", version = "0.2.0" }
async-trait = "0.1"
base64 = "0.23"
extism = "1"
jsonrpsee = { version = "0.26", features = ["http-client"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "io-util", "process", "time", "macros"] }
tracing = "0.1"
unicode-casefold = { workspace = true }
unicode-normalization = { workspace = true }

[features]
default = []
# Reach an extension over JSON-RPC HTTP with `http::HttpChannel`.
http = ["dep:jsonrpsee"]

[dev-dependencies]
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
morphir-avro-extension = { path = "../morphir-avro-extension" }
morphir-host = { path = "../morphir-host", features = ["testing"] }
morphir-projection = { path = "../morphir-projection", version = "0.1.0", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
wat = "1"

[[example]]
name = "mep-http-backend"
required-features = ["http"]

