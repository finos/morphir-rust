[package]
name = "morphir-mck-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Morphir Compatibility Kit adapter for morphir-rust: the JSON-lines testee protocol"

[[bin]]
name = "mck-adapter-rust"
path = "src/main.rs"

[dependencies]
semver = "1"
morphir-core = { path = "../morphir-core", version = "0.2.0" }
morphir-common = { path = "../morphir-common" }
morphir-package = { path = "../morphir-package" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
anyhow = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt"] }
package_tough = { package = "morphir-package-tough", path = "../../third_party/morphir-package-tough", default-features = false, features = ["experimental-storage"] }
rusqlite = "=0.40.2"
base64 = "0.22"
sha2 = "0.11"

[dev-dependencies]
