[package]
name = "morphir-package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Experimental Morphir Library package metadata and integrity verification"

[dependencies]
morphir-core = { path = "../morphir-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.11"
jsonschema = { version = "0.56", default-features = false }
thiserror.workspace = true
# Preserve Noble zip215:false: canonical points, non-small-order A, cofactored equation.
ed25519-zebra = { version = "4.2", default-features = false, features = ["std"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc"] }
base64 = "0.22"

[dev-dependencies]
fs2 = "0.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
