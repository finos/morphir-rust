[package]
name = "morphir-package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Experimental Morphir Library package metadata and integrity verification"

[dependencies]
morphir-core = { path = "../morphir-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.11"
jsonschema = { version = "0.56", default-features = false }
thiserror.workspace = true
# Preserve Noble zip215:false: canonical points, non-small-order A, cofactored equation.
ed25519-zebra = { version = "4.2", default-features = false, features = ["std"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc"] }
base64 = "0.22"

package_tough = { package = "morphir-package-tough", path = "../../third_party/morphir-package-tough", default-features = false, features = ["experimental-storage"] }
async-trait = "0.1"
jiff = "0.2"
bytes = "1"
futures = "0.3"
url = "2"

fs2 = "0.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
