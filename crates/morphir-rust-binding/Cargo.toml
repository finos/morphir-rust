[package]
name = "morphir-rust-binding"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust type frontend and backend for Morphir IR v3 and v4"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
morphir-core = { path = "../morphir-core" }
morphir-extension-sdk = { path = "../morphir-extension-sdk" }
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
prettyplease.workspace = true
serde_json = "1"
indexmap = "2"

[dev-dependencies]
tempfile.workspace = true
cucumber = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
wasm-host-tests = ["dep:extism"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
extism = { version = "1", optional = true }

[[test]]
name = "acceptance"
harness = false
