[package]
name = "morphir-workspace-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser JSON adapter for portable Morphir workspace discovery"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "morphir-workspace-wasm-metadata"
path = "src/bin/metadata.rs"
required-features = ["metadata-helper"]

[features]
metadata-helper = []

[dependencies]
morphir-workspace = { path = "../morphir-workspace" }
serde_json = "1.0"
wasm-bindgen = "=0.2.128"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
