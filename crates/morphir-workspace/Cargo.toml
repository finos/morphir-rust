[package]
name = "morphir-workspace"
# Published on its own 0.x.y line, not the shared workspace version.
# See docs/contributors/publishing-crates.md.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable, root-confined Morphir workspace discovery"

[dependencies]
morphir-config = { path = "../morphir-config", version = "0.0.1" }
globset = "0.4"
semver = { version = "1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
