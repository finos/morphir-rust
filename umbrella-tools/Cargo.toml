# The Rust development tools of finos/morphir, the Morphir umbrella repository: the Morphir
# Compatibility Kit engine and runner (`morphir-mck`) and the internal development tool
# (`morphir-dev`). They read the specifications, kits and fixtures of finos/morphir by relative
# path, so they build only from its `ecosystem/morphir-rust` submodule. See README.md.
#
# This is a workspace of its own, not a part of the morphir-rust workspace one level up: a
# checkout of morphir-rust alone cannot build these crates, and its `crates/*` members and CI
# must not depend on a finos/morphir checkout.
[workspace]
members = ["crates/*"]
# A path dependency below this directory joins this workspace unless it is excluded. Without the
# exclusion, `cargo clippy -p morphir-mck-cli -- -D warnings` fails on upstream lints in vendored
# TUF code this repository does not own. The crates of the main workspace (`../crates/*`) are
# outside this directory: they stay members of that workspace and inherit from its manifest.
exclude = ["third_party/rust-tuf"]
default-members = ["crates/morphir-mck-cli", "crates/morphir-dev-tools"]
resolver = "3"

# Test-only fixture verification needs the already-adopted TUF 1.0.36 wire profile.
# Provenance and the single-version compatibility patch: third_party/rust-tuf/MORPHIR-VENDOR.md.
[patch.crates-io]
tuf = { path = "third_party/rust-tuf" }

[workspace.package]
version = "0.4.0-beta.12"
edition = "2024"
rust-version = "1.98"
authors = [
    "FINOS <info@finos.org>",
    "Damian Reeves <957246+DamianReeves@users.noreply.github.com>",
]
license = "Apache-2.0"
repository = "https://github.com/finos/morphir-rust"
homepage = "https://github.com/finos/morphir-rust"
keywords = ["morphir", "functional", "domain-modeling", "ir"]
categories = ["development-tools", "parsers"]

[workspace.dependencies]
# Command-line framework of the development tools
clap = { version = "4.5.57", features = ["derive", "color"] }
anyhow = "1.0"
base64 = "0.23"
cap-fs-ext = "4.0.0"
cap-std = "4.0.0"
same-file = "1.0.6"
thiserror = "2.0.18"
miette = { version = "7", features = ["fancy"] }
cucumber = "0.23"
vfs = "0.13"
sha2 = "0.11"
# `morphir-mck run --filter` uses Rust regex syntax (spec/mck/cli-contract.md)
regex = "1"
similar = "3.2"
# Kit archives from github:finos/morphir (morphir-mck)
flate2 = "1"
tar = { version = "0.4", default-features = false }
# `morphir-mck kit vendor --source github:finos/morphir` (crates/morphir-mck-cli)
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Structured logging
tracing = "0.1"
fs2 = "0.4"
rustix = { version = "1.1", features = ["fs"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Offline draft MCK report validation; no HTTP or filesystem reference retrieval.
jsonschema = { version = "=0.26.2", default-features = false }
serde-saphyr = { version = "1", default-features = false, features = ["deserialize", "serialize"] }
# The IR YAML profile reader in `morphir-core` walks this parser's event stream. `morphir-core`
# takes its pin from the main workspace (`../Cargo.toml`), and one build links one version, so
# this pin is exact and must equal that one. Change both in the same commit.
granit-parser = { version = "=1.3.0", default-features = false, features = ["std", "error_messages"] }
stacker = "0.1"
toml = "1.0.0"
tempfile = "3"
semver = "1"
ed25519-dalek = "3"
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.25"
url = "2.5.8"
percent-encoding = "2.3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
